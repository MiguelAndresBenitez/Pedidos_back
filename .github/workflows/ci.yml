name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check
      - name: Formato
        run: uv run ruff format --check
      - name: Tipos
        run: uv run mypy
      - name: Tests
        run: uv run pytest -v
